name: Demo UI

on:
  pull_request:
    paths: ['demo/**', 'frontend/**', '.github/workflows/demo-ui.yml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wms-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci --prefix demo --ignore-scripts
      - run: node demo/node_modules/@playwright/test/cli.js install --with-deps chromium
      - working-directory: demo
        run: node scripts/build-pages-artifact.mjs && node scripts/verify-ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wms-ui-screenshots
          path: demo/artifacts/ui
          retention-days: 7
