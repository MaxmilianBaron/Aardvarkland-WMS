name: Regression workspace

on:
  pull_request:
    paths:
      - '.github/workflows/regression-workspace.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: wms
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MaxmilianBaron/Aardvarkland-WMS-Mini
          ref: 7635584bc54f4205a64568df9153462e39415ed3
          persist-credentials: false
          path: mini
      - name: Collect source snapshots
        run: |
          mkdir -p /tmp/workspace-artifacts
          tar --exclude=.git --exclude=node_modules -czf /tmp/workspace-artifacts/source.tar.gz wms mini
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-source
          path: /tmp/workspace-artifacts/source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - name: Prepare dependency installations
        run: |
          (cd mini && npm ci)
          (cd wms/frontend && npm ci)
          (cd wms/backend && npm ci && npm run prisma:generate)
          mkdir -p tools
          cp "$(command -v node)" tools/node
          cd tools
          npm init --yes
          npm install --ignore-scripts --save-exact @playwright/test@1.55.0
      - name: Collect verification dependencies
        run: |
          tar -czf /tmp/workspace-artifacts/dependencies.tar.gz mini/node_modules wms/frontend/node_modules wms/backend/node_modules wms/backend/src/generated tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-dependencies
          path: /tmp/workspace-artifacts/dependencies.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Prepare browser
        run: |
          cd tools
          PLAYWRIGHT_BROWSERS_PATH=/tmp/regression-browsers npx playwright install chromium --only-shell
          tar -czf /tmp/workspace-artifacts/browser.tar.gz -C /tmp regression-browsers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-browser
          path: /tmp/workspace-artifacts/browser.tar.gz
          retention-days: 1
          compression-level: 0
