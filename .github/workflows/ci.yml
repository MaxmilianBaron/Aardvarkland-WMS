name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Verify first-run setup
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null && \
               curl --fail --silent \
                 --header 'Content-Type: application/json' \
                 --data '{"email":"admin@example.com","password":"Local-Seed-42!"}' \
                 http://127.0.0.1:4001/api/auth/login >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify same-origin API and non-root runtime
        run: |
          curl --fail --silent --header 'Content-Type: application/json' --data '{"email":"admin@example.com","password":"Local-Seed-42!"}' http://127.0.0.1:4000/api/auth/login > /dev/null
          curl --fail --silent --head http://127.0.0.1:4001/api/health/ready | grep --ignore-case 'cache-control: no-store, private'
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
      - if: failure()
        run: |
          docker compose ps
          docker compose logs
      - if: always()
        run: docker compose down --volumes

  backend:
    env:
      DATABASE_URL: postgresql://postgres:regression-test-only@127.0.0.1:55432/wms_regressions
      WMS_TEST_DATABASE_URL: postgresql://postgres:regression-test-only@127.0.0.1:55432/wms_regressions
    services:
      regression-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: regression-test-only
          POSTGRES_DB: wms_regressions
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres -d wms_regressions" --health-interval 5s --health-timeout 5s --health-retries 15
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run prisma:deploy
      - run: node --test scripts/transaction-regressions.test.mjs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  print-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: print-agent/package-lock.json
      - run: npm ci
      - run: npm run check
