<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="Aardvarkland WMS mobile preview">
  <title>Aardvarkland WMS · mobile preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f4;color:#151922;font-family:Consolas,"Courier New",Courier,monospace}body{min-height:100vh;display:flex;flex-direction:column}.preview-header{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 22px;border-bottom:1px solid #d9e0e6;background:#fff}.preview-header div{min-width:0}.preview-header span,.preview-header strong{display:block}.preview-header span{color:#8b94a3;font-size:10px;text-transform:uppercase}.preview-header strong{margin-top:3px;font-size:14px}.preview-header a{color:#596273;font-size:12px;font-weight:600}.preview-stage{flex:1;display:grid;place-items:center;padding:28px}.phone{width:411px;height:868px;max-width:100%;overflow:hidden;border:10px solid #111827;border-radius:34px;background:#fff;box-shadow:0 24px 70px rgba(17,24,39,.22)}.phone iframe{display:block;width:100%;height:100%;border:0;background:#fff}@media(max-width:520px){.preview-header{display:none}.preview-stage{padding:0;display:block}.phone{width:100vw;height:100vh;max-width:none;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header class="preview-header">
    <div><span>Aardvarkland WMS</span><strong>Mobile preview</strong></div>
    <a href="./" target="_blank" rel="noreferrer">Open standalone</a>
  </header>
  <main class="preview-stage">
    <div class="phone" aria-label="Aardvarkland WMS mobile preview">
      <iframe src="./?mobileFrame=1" title="Aardvarkland WMS mobile preview"></iframe>
    </div>
  </main>
</body>
</html>
